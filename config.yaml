model:
  default: openrouter/free
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  aliases:
    router-free: openrouter/free
    cloud-free-expert: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    cloud-free-coding: openrouter/cohere/north-mini-code:free
    cloud-free-reasoning: openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    cloud-free-gemma: openrouter/google/gemma-4-26b-a4b-it:free
    local-fast: llama3.1:8b
    local-strategic: gemma2:27b
    local-omniscient: hermes3:latest
fallback_providers:
  provider: openrouter
  model: nvidia/nemotron-3-ultra-550b-a55b:free
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 300
  service_tier: ''
  fast_auto_seconds: 45
  verbose: false
  reasoning_effort: medium
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 3600
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  backend: browser-use
  inactivity_timeout: 120
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: false
  warn_after:
    exact_failure: 10
    same_tool_failure: 10
    idempotent_no_progress: 10
  hard_stop_after:
    exact_failure: 15
    same_tool_failure: 15
    idempotent_no_progress: 15
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.45
  target_ratio: 0.15
  protect_last_n: 30
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  hygiene_max_turn_hold_seconds: 10
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 5
delegation:
  model: router-free
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  max_iterations: 250
  max_concurrent_children: 5
skills:
  creation_nudge_interval: 15
approvals:
  mode: 'off'
  destructive_slash_confirm: false
command_allowlist:
- shell command via -c/-lc flag
- command parser limit or malformed executable payload
- overwrite project env/config file
- delete in root path
- stop/restart hermes gateway (kills running agents)
- hermes update (restarts gateway, kills running agents)
- overwrite system config
- stop/restart system service
- script execution via -e/-c flag
- script execution via heredoc
- overwrite system file via redirection
plugins:
  enabled:
  - a2a
  - browser/browser_use
  - browser/browserbase
  - clarify
  - code_execution
  - computer_use
  - connections
  - context_engine
  - cron_providers/chronos
  - cronjob
  - dashboard_auth/basic
  - delegation
  - discord
  - discord_admin
  - disk-cleanup
  - file
  - google_meet
  - homeassistant
  - image_gen
  - kanban
  - memory
  - session_search
  - skills
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - web/brave_free
  - x_search
  - yuanbao
  - brev
  disabled: []
cron:
  catch_up_missed: true
  provider: chronos
kanban:
  review_dispatch: true
code_execution:
  timeout: 600
  max_tool_calls: 100
gateway:
  signal_interrupt_grace_timeout: 1
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  loop_watchdog_max_strikes: 3
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
streaming:
  enabled: true
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
telemetry:
  shared_metrics:
    enabled: false
    send: false
updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
proxy:
